    <title>TYPBOX // Study Time Tracker</title>
    <meta name="description" content="TYPBOX is a study tracker: time your sessions, sort them by subject and watch your study hours add up. Every hour earns BITS for buffs, boss raids and your own pixel room." />

    <!-- Prevent Flash of Unstyled Theme on page reload -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('typbox_theme');
          var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
